name: Publish

# 手动触发：把**指定 tag** 的包体 stage 到 npm，再由维护者带 2FA 执行
# `npm stage approve <stage-id>` 完成发布。
#
# 为什么钉 tag 而不是当前 main（2026-11-09 的事故）：`workflow_dispatch` 的
# `actions/checkout` 不给 ref 时取触发那一刻的 main，于是「npm 上的包对应哪个
# commit」永久不可考——已发布的 6.9.0 是从 main 的 f5ea5c1 打的，而 tag v6.9.0
# 指向 821ee68；两者出货文件不同（README 双语、package.json 的 publishConfig）。
# 现在 `version` 是必填项，checkout 直接取 `refs/tags/v<version>` 并断言
# package.json.version 与之一致：tag 不存在则 checkout 直接失败，想漂都漂不了。
#
# 为什么在 CI 而不是本机（issue #49）：维护机出口上行被限到 ~23 KB/s，
# 17.7 MB 的 tarball 传不完（2026-11-09 三次实测均在中途 ECONNRESET）；
# runner 上行正常。tarball 体积压不下来——主体是 vendor 的 templates/，
# 而 vendor 面必须逐字节完整（attribution_guard.py 完整性门）。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本，须与 tag v<version> 及 package.json 一致（如 6.9.0-r1）'
        required: true
      dist_tag:
        description: 'npm dist-tag（修订版如 6.9.0-r1 属 semver 预发布，必须显式 latest）'
        required: true
        default: latest
      dry_run:
        description: '只校验包体，不 stage'
        type: boolean
        default: false

permissions:
  contents: read
  # --provenance 用 OIDC 换签名：npm 侧据此签发可验证的证明，把包永久绑定到
  # 这个 commit、这个 workflow、这次运行。没有它，「这包是从哪来的」只能靠人记。
  id-token: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/v${{ inputs.version }}

      # checkout 成功只证明 tag 存在，不证明它与包体一致：tag 打在旧 commit 上、
      # 或 package.json 忘了改版本号，都会让「tag 说 6.9.0-r1、包里是 6.9.0」这种
      # 错位一路走到 registry，且发布后不可撤销。
      - name: Assert the tag matches the manifest
        run: |
          node -e '
            const want = process.env.WANT;
            const got = require("./package.json").version;
            if (got !== want) {
              console.error(`FAIL: tag 是 v${want}，但 package.json.version 是 ${got}`);
              process.exit(1);
            }
            console.log(`version ok: ${got}`);
          '
        env:
          WANT: ${{ inputs.version }}

      # Node 24 而非 22.12：`npm stage` 是 npm >= 11 的能力，Node 22.12 自带的
      # npm 10 没有该子命令。这里只打包/暂存，不运行插件，与 engines.node 无关。
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Show toolchain
        run: |
          node --version
          npm --version

      # vendor 完整性前置：`files` 白名单若漏掉 skills/ 下任何文件，装上的插件会在
      # attribution_guard.py 完整性门上失败——那是**用户侧**才炸，本地测试全绿也发现不了。
      - name: Verify the vendored tree is packaged whole
        run: |
          node - <<'JS'
          const { execSync } = require('node:child_process')
          const onDisk = execSync('find skills -type f | wc -l').toString().trim()
          // maxBuffer 必须放大：13107 个文件的清单 JSON 超过 execSync 默认的 1 MB，
          // 截断后 JSON.parse 会失败（2026-11-09 首次运行即踩到）。
          const meta = JSON.parse(
            execSync('npm pack --dry-run --json', { maxBuffer: 64 * 1024 * 1024 }).toString(),
          )
          const p = Array.isArray(meta) ? meta[0] : meta
          const inTarball = (p.files || []).filter((f) => f.path.startsWith('skills/')).length
          console.log(`package: ${p.name}@${p.version}  tarball=${(p.size / 1048576).toFixed(1)}MB  files=${p.entryCount}`)
          console.log(`vendor files: on disk=${onDisk}  in tarball=${inTarball}`)
          if (onDisk !== String(inTarball)) {
            console.error('FAIL: 打包后的 vendor 文件数与磁盘不一致——完整性门会在用户侧失败')
            process.exit(1)
          }
          JS

      - name: Stage on npm
        if: ${{ !inputs.dry_run }}
        run: npm stage publish --tag "${{ inputs.dist_tag }}" --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Next step
        if: ${{ !inputs.dry_run }}
        run: |
          echo "已暂存。发布需要维护者带 2FA 批准："
          echo "  npm stage list --registry=https://registry.npmjs.org"
          echo "  npm stage approve <stage-id>"
