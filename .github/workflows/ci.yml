name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 零 npm 依赖（package.json 无 dependencies/devDependencies）——无需 npm install。
      # 宿主 SDK（@deepseek-ai/*）以 stub 树供给：构造默认形态 stub node_modules，
      # 经 DSH_NODE_MODULES（resolveDshModules 定位链第②级，优先于一切目录探测）
      # 同时服务测试进程与子进程的模块加载期受控解析（issue #4）。
      - name: Build stub SDK tree
        run: node tests/helpers/stub-sdk.mjs .ci-stub

      # 预期基线：732 tests / 730 pass / 0 fail / 2 skip（2026-11-05 实测：本机 CI 等价环境 732/729/1/2，红的是 ~/.ppt-master/.env 触发的 envFileExists；CI 无该文件 ⇒ 0 fail。须 unset DSH_HOME，否则测试会沿 profiles/web 解析到真实 SDK 而不 skip）。
      # 本机若存在 ~/.ppt-master/.env，setup_deps 的 envFileExists 用例会额外红一条（与 SDK 无关；CI 无该文件）。
      # 2 条 skip 是显式声明（@deepseek-ai/dsh-tools 经包自身解析不可达——本包零依赖，
      # stub 树不经包解析链，故 skip 非失败）。失败时 TAP 输出逐用例定位。
      - name: Run test suite (stub SDK)
        env:
          DSH_NODE_MODULES: ${{ github.workspace }}/.ci-stub/node_modules
        run: node --test tests/*.test.mjs

      # 契约探针在 stub 形态下同样可跑（SkillRegistry 挂载/ToolRuntime register/
      # §7.7①-⑥ 静态与实跑断言）；§7.7⑦ 正向路径在无 @deepseek-ai/dsh-scope 时
      # 只记 note（problems 0，不判失败）。
      - name: check-dsh-compat (stub SDK)
        env:
          DSH_NODE_MODULES: ${{ github.workspace }}/.ci-stub/node_modules
        run: node scripts/check-dsh-compat.mjs

      # verify-plugin 不在 CI 跑：其第⑥项全量逐字节比对必须显式 --upstream 比对树
      # （真实上游解压树，GitHub runner 无缓存，缺省即 fail-loud exit 1）；该逻辑已由
      # tests/verify-plugin.test.mjs 用 fixtures 覆盖。本地/同步流程仍照常执行。

  # ─── 声明下限验证（engines.node >= 22.12.0 防漂移，issue M29 / #40）────────
  # 本 job 是 package.json `engines.node: ">=22.12.0"` 声明的补充验证，
  # **不是必需检查**；main 分支保护的必需状态检查仍是上方的 `test`（无矩阵后缀）。
  # 22.12.0 不是随手挑的版本：它是装载链路的真实下限——`index.js` 经
  # `require()` 取 schemastery，而 schemastery 的 CJS 构建首行 require ESM-only 的
  # cosmokit，这一跳是 Node 的 `require(esm)`，Node 22.12.0 起才默认开启（#40）。
  # 上方 `test` job 跑 Node 22 的最新版，发现不了「用了比 22.12 更新的 API」这类漂移；
  # 此处**钉死 22.12.0** 复跑同一套件，漂移即红灯。
  # 注意：不得把本 job 改名/合并进 `test` 的 matrix——check 名一旦变为
  # `test (22)` / `test (22.12)`，受保护的必需检查 `test` 将永远无法满足。
  node22-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      # 与 `test` job 同一 stub 构造路径（详见上方注释），保证两侧测试环境同形态。
      - name: Build stub SDK tree
        run: node tests/helpers/stub-sdk.mjs .ci-stub

      - name: Run test suite (stub SDK, Node 22.12.0 = declared floor)
        env:
          DSH_NODE_MODULES: ${{ github.workspace }}/.ci-stub/node_modules
        run: node --test tests/*.test.mjs
