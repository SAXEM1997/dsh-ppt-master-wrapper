name: release

# 推 tag 即发布：`v<version>` → 门禁 → `npm publish` → 校验已发布的包 → GitHub Release。
# 与 dsh-boost 的 release.yml 同一形状（tag 触发、NPM_TOKEN 直发、notes 入库），
# 差异只在本仓库的记账门禁与 provenance。
#
# 为什么顺序是「发布 → Release」而不是反过来：Release 页面等于「宣布可安装的版本」。
# 先建 Release 再发布，npm 一旦拒收，页面就指向一个装不上的包——且这是读者看不出来的失败。
#
# 三条会静默出错的规则（每条都对应下面一道门）：
#   1. tag 与 package.json 不一致：npm 按 manifest 发布，tag/Release 却声称另一个版本。
#   2. notes 文件缺失或为空：Release body 变成空壳；npm 页面还会永久固化 tarball 里的 README。
#   3. 版本已存在时重复发布：npm 直接 409。这里先查 registry，存在则跳过，重跑安全。
#
# 凭证是仓库 secret `NPM_TOKEN`（与 dsh-boost 相同做法），不再走 npm stage + 2FA。
# 若 token 受 npm「限制绕过 2FA 的 token」新政影响，`npm whoami` 或 publish 会先失败；
# 兜底是仍保留的 `.github/workflows/publish.yml`（stage + 维护者 2FA 批准）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本（如 6.10.0-r1）；仅用于 dry-run 或补跑'
        required: true
      dry_run:
        description: '只跑门禁与打包校验，不发布、不建 Release'
        type: boolean
        default: true
      source_ref:
        description: 'dry-run 专用：从这个 ref 取代码（默认取 tag；真发布永远只认 tag）'
        required: false
        default: ''

permissions:
  contents: write # gh release create
  id-token: write # --provenance 的 OIDC 签名

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Resolve the version and the ref to check out
        id: v
        run: |
          set -euo pipefail
          SOURCE_REF="${{ inputs.source_ref }}"
          DRY="${{ inputs.dry_run }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            REF="refs/tags/v$VERSION"
            PINNED_TAG=true
          else
            VERSION="${{ inputs.version }}"
            if [ -n "$SOURCE_REF" ]; then
              [ "$DRY" = "true" ] || {
                echo "::error::source_ref is only allowed with dry_run=true"
                exit 1
              }
              REF="$SOURCE_REF"
              PINNED_TAG=false
            else
              REF="refs/tags/v$VERSION"
              PINNED_TAG=true
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "pinned_tag=$PINNED_TAG" >> "$GITHUB_OUTPUT"
          echo "releasing $VERSION from $REF (tag-pinned: $PINNED_TAG)"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.v.outputs.ref }}
          persist-credentials: false

      - name: The tag and the manifest name the same version
        run: |
          set -euo pipefail
          VERSION="${{ steps.v.outputs.version }}"
          GOT=$(node -p "require('./package.json').version")
          [ "$GOT" = "$VERSION" ] || {
            echo "::error::tag v$VERSION but package.json.version is $GOT"
            exit 1
          }
          if [ "${{ steps.v.outputs.pinned_tag }}" != "true" ]; then
            echo "dry run from ${{ steps.v.outputs.ref }}: manifest matches, tag existence not asserted"
          fi
          echo "manifest ok: $GOT"

      # CONTRIBUTING 要求附注 tag 打在合并提交上；轻量 tag 或从分支打出的 tag 直接拒。
      - name: The tag is annotated and on main
        if: steps.v.outputs.pinned_tag == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.v.outputs.version }}"
          git fetch --depth=1 origin "refs/tags/v$VERSION"
          TYPE=$(git cat-file -t "refs/tags/v$VERSION")
          [ "$TYPE" = "tag" ] || {
            echo "::error::v$VERSION is a lightweight tag; use git tag -a"
            exit 1
          }
          # 用 checkout 出来的提交，而不是 $GITHUB_SHA：dispatch 时后者是触发分支的
          # 提交（通常是 main），拿它比 main 永远 identical，门禁形同虚设。
          HEAD_SHA=$(git rev-parse HEAD)
          STATUS=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$HEAD_SHA" --jq .status)
          case "$STATUS" in
            behind|identical) echo "tag is on main ($STATUS)" ;;
            *) echo "::error::v$VERSION points at $HEAD_SHA, which is not on main ($STATUS)"; exit 1 ;;
          esac

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Toolchain
        run: |
          node --version
          npm --version

      - name: Token preflight
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami

      - name: The release notes for this version exist
        run: |
          set -euo pipefail
          NOTES="docs/releases/v${{ steps.v.outputs.version }}.md"
          [ -s "$NOTES" ] || {
            echo "::error file=$NOTES::missing — the release body is this file, in Chinese then English"
            exit 1
          }
          echo "$NOTES: $(wc -l < "$NOTES") lines"

      # 版本记账四处联动，漏一处 Release 页面或卡片就会与文档对不上。
      - name: Version bookkeeping is present
        run: |
          set -euo pipefail
          VERSION="${{ steps.v.outputs.version }}"
          for f in README.md README.en.md AGENTS.md; do
            grep -q "| \`v$VERSION\` |" "$f" || {
              echo "::error file=$f::missing the | \`v$VERSION\` | row"
              exit 1
            }
          done
          CLIENT=$(node -e "
            const s = require('fs').readFileSync('lib/client.js', 'utf8');
            const m = s.match(/const PLUGIN_VERSION = '([^']+)'/);
            if (!m) { console.error('PLUGIN_VERSION not found in lib/client.js'); process.exit(2); }
            process.stdout.write(m[1]);
          ")
          [ "$CLIENT" = "$VERSION" ] || {
            echo "::error file=lib/client.js::PLUGIN_VERSION is $CLIENT, expected $VERSION"
            exit 1
          }
          echo "bookkeeping ok (rows + lib/client.js)"

      # runner 上没有宿主 SDK：与 ci.yml 一样先建默认 stub 树，2 条 skip 是显式声明。
      - name: Test (stub SDK tree)
        run: |
          set -euo pipefail
          node tests/helpers/stub-sdk.mjs .ci-stub
          DSH_NODE_MODULES="$PWD/.ci-stub/node_modules" node --test tests/*.test.mjs

      # `prepack`（check-pack）也在这里跑：个人模板库若在仓库里，打包阶段直接失败。
      - name: Pack gate
        run: npm pack --dry-run >/dev/null

      # 打一次本地包，供后面的「逐文件比对」使用；同时核对 vendor 文件数。
      # 不按字节比：要证明的是「用户装到的文件 == 这个 tag 的树」，而 tar 元数据
      # （文件模式、压缩实现）会让同一份内容在不同环境得到不同字节；逐文件 diff 才是
      # 这个语义。首次真发（v6.10.0-r2）实际卡在 publish 前 npm view 的 E404 负缓存，
      # 不是字节差异——所以下载侧同时用 --prefer-online 绕开缓存。
      - name: Pack this tree for verification
        id: pack
        run: |
          set -euo pipefail
          npm pack --json > "$RUNNER_TEMP/pack.json"
          node -e '
            const fs = require("fs");
            const path = require("path");
            const [entry] = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/pack.json", "utf8"));
            const walk = (dir) => fs.readdirSync(dir, { withFileTypes: true })
              .reduce((n, d) => n + (d.isDirectory() ? walk(path.join(dir, d.name)) : 1), 0);
            const onDisk = walk("skills");
            const inTarball = entry.files.filter((f) => f.path.startsWith("skills/")).length;
            if (onDisk !== inTarball) {
              console.error(`vendor files on disk=${onDisk} in tarball=${inTarball} — the package would fail attribution_guard.py`);
              process.exit(1);
            }
            console.log(`vendor files: on disk=${onDisk} in tarball=${inTarball}`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `file=${entry.filename}\n`);
          '

      - name: Publish to npm when this version is new
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.v.outputs.version }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "dry run: not publishing"
            npm publish --dry-run --tag latest
            exit 0
          fi
          set +e
          OUT=$(npm view "dsh-ppt-master-wrapper@$VERSION" version --prefer-online 2>&1)
          RC=$?
          set -e
          if [ "$RC" -eq 0 ]; then
            echo "dsh-ppt-master-wrapper@$VERSION is already published; skipping (re-run path)"
          elif printf '%s' "$OUT" | grep -qE 'E404|404 Not Found'; then
            npm publish --provenance --tag latest
          else
            echo "::error::npm view failed for a reason other than E404"
            printf '%s\n' "$OUT"
            exit 1
          fi

      # tarball 不按字节比：同一份内容在不同环境/时刻打出的 tar 元数据可能不同，
      # 真正要证明的是「用户装到的文件 == 这个 tag 的树」，所以解包后做内容 diff；
      # --prefer-online 用来绕过 publish 之前那次 E404 留下的负缓存。
      - name: Verify the published contents match this tree
        if: github.event_name == 'push' || inputs.dry_run != true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          NAME="dsh-ppt-master-wrapper"
          VERSION="${{ steps.v.outputs.version }}"
          LOCAL="${{ steps.pack.outputs.file }}"
          for attempt in $(seq 1 20); do
            rm -rf "$RUNNER_TEMP/registry" "$RUNNER_TEMP/reg-x" "$RUNNER_TEMP/local-x"
            mkdir -p "$RUNNER_TEMP/registry" "$RUNNER_TEMP/reg-x" "$RUNNER_TEMP/local-x"
            if npm pack "$NAME@$VERSION" --prefer-online --pack-destination "$RUNNER_TEMP/registry" >/dev/null 2>&1; then
              tar -xzf "$RUNNER_TEMP/registry/$NAME-$VERSION.tgz" -C "$RUNNER_TEMP/reg-x"
              tar -xzf "$LOCAL" -C "$RUNNER_TEMP/local-x"
              if ! diff -r "$RUNNER_TEMP/local-x/package" "$RUNNER_TEMP/reg-x/package"; then
                echo "::error::the published contents differ from this tag's tree"
                exit 1
              fi
              FILES=$(find "$RUNNER_TEMP/reg-x/package" -type f | wc -l)
              echo "contents match ($FILES files)"
              exit 0
            fi
            echo "attempt $attempt: tarball not downloadable yet"
            sleep 30
          done
          echo "::error::$NAME@$VERSION never became downloadable"
          exit 1

      - name: Create the GitHub Release (idempotent)
        if: github.event_name == 'push' || inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.v.outputs.version }}"
          NOTES="docs/releases/v$VERSION.md"
          # checkout 已证明这个 tag 存在；--verify-tag 再向远端确认一次，避免在
          # checkout 与建 Release 之间 tag 被删时 gh 用默认分支的提交补一个同名 tag。
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release edit "v$VERSION" --notes-file "$NOTES" --draft=false
          else
            gh release create "v$VERSION" \
              --title "v$VERSION" \
              --notes-file "$NOTES" \
              --verify-tag
          fi
